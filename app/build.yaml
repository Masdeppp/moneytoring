targets:
  $default:
    builders:
      drift_dev:
        options:
          # Tanggal disimpan sebagai teks ISO-8601: mudah dibaca dan
          # menyimpan zona waktu (disarankan Drift untuk project baru).
          store_date_time_values_as_text: true
          # Dipakai `dart run drift_dev make-migrations` untuk menyimpan
          # snapshot skema per versi dan membuat test migrasi.
          databases:
            keuangan: lib/data/db/app_database.dart
          schema_dir: drift_schemas/
          test_dir: test/drift/
